name: kelola_karyawan
description: "Flutter app untuk Kelola Karyawan - Employee Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # API & HTTP
  http: ^1.1.0
  dio: ^5.3.0

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Local Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.0

  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  smooth_page_indicator: ^1.1.0

  # Form & Validation
  form_validator: ^1.1.0
  intl: ^0.19.0

  # Date & Time
  intl_utils: ^2.0.0

  # Image Handling
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.0

  # Navigation
  go_router: ^12.0.0

  # Notifications
  flutter_local_notifications: ^16.3.0
  firebase_messaging: ^14.7.0
  firebase_core: ^2.24.0

  # Logging
  logger: ^2.0.0

  # Utils
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0
  device_info_plus: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
